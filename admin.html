<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Brothko Institute</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbhUJkMbLwsu8kgVC5zSmePpOr5EX6kyI",
      authDomain: "brothkointituteweb.firebaseapp.com",
      projectId: "brothkointituteweb",
      storageBucket: "brothkointituteweb.firebasestorage.app",
      messagingSenderId: "893115179713",
      appId: "1:893115179713:web:32bbe9218f434e211eea40"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.adminLogin = async function() {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        document.getElementById("adminLoginBox").classList.add("hidden");
        document.getElementById("adminDashboard").classList.remove("hidden");
        loadNotes();
      } catch (err) {
        document.getElementById("adminError.innerText = "❌ Invalid Admin/Co-Admin Credentials";
        document.getElementById("adminError").classList.remove("hidden");
      }
    };

    window.adminLogout = async function() {
      await signOut(auth);
      location.reload();
    };

    // Add PDF / Notes
    window.addPDF = async function() {
      const title = document.getElementById("pdfTitle").value.trim();
      const fileUrl = document.getElementById("pdfUrl").value.trim();
      if (!title || !fileUrl) return alert("Please fill all fields");

      try {
        await addDoc(collection(db, "notes"), { title, file: fileUrl, createdAt: new Date() });
        alert("PDF Added Successfully!");
        document.getElementById("pdfTitle").value = "";
        document.getElementById("pdfUrl").value = "";
        loadNotes();
      } catch (e) {
        alert("Error adding PDF: " + e.message);
      }
    };

    // Add Question
    window.addQuestion = async function() {
      const subject = document.getElementById("qSubject").value;
      const qText = document.getElementById("qText").value.trim();
      const opt1 = document.getElementById("opt1").value.trim();
      const opt2 = document.getElementById("opt2").value.trim();
      const opt3 = document.getElementById("opt3").value.trim();
      const opt4 = document.getElementById("opt4").value.trim();
      const answer = document.getElementById("qAnswer").value.trim();

      if (!qText || !opt1 || !opt2 || !answer) return alert("Fill required fields");

      try {
        await addDoc(collection(db, "questions"), {
          subject,
          q: qText,
          options: [opt1, opt2, opt3, opt4].filter(o => o !== ""),
          answer
        });
        alert("Question Added Successfully!");
        document.getElementById("qText").value = "";
        document.getElementById("opt1").value = "";
        document.getElementById("opt2").value = "";
        document.getElementById("opt3").value = "";
        document.getElementById("opt4").value = "";
        document.getElementById("qAnswer").value = "";
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    async function loadNotes() {
      const notesList = document.getElementById("notesList");
      notesList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "notes"));
      querySnapshot.forEach((doc) => {
        let note = doc.data();
        notesList.innerHTML += `<li class="text-sm text-gray-700">📄 ${note.title}</li>`;
      });
    }
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-xl">
    <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">📂 Brothko Admin & Co-Admin Panel</h2>

    <!-- Login Box -->
    <div id="adminLoginBox">
      <input id="adminEmail" type="email" placeholder="Admin/Co-Admin Email" class="w-full border p-3 rounded-lg mb-3">
      <input id="adminPass" type="password" placeholder="Password" class="w-full border p-3 rounded-lg mb-3">
      <button onclick="adminLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-semibold">Login</button>
      <p id="adminError" class="text-red-500 mt-3 text-center font-medium hidden"></p>
    </div>

    <!-- Dashboard -->
    <div id="adminDashboard" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b pb-3">
        <span class="font-semibold text-gray-700">Welcome Admin</span>
        <button onclick="adminLogout()" class="bg-red-500 text-white px-4 py-1 rounded text-sm">Logout</button>
      </div>

      <!-- Add Questions -->
      <div class="bg-gray-50 p-4 rounded-lg border">
        <h3 class="font-semibold mb-2 text-green-600">❓ Add Quiz Question</h3>
        <select id="qSubject" class="w-full border p-2 rounded mb-2">
          <option value="java">Java</option>
          <option value="python">Python</option>
          <option value="htmlcss">HTML & CSS</option>
          <option value="javascript">JavaScript</option>
        </select>
        <input id="qText" type="text" placeholder="Question Text" class="w-full border p-2 rounded mb-2">
        <input id="opt1" type="text" placeholder="Option 1" class="w-full border p-2 rounded mb-2">
        <input id="opt2" type="text" placeholder="Option 2" class="w-full border p-2 rounded mb-2">
        <input id="opt3" type="text" placeholder="Option 3" class="w-full border p-2 rounded mb-2">
        <input id="opt4" type="text" placeholder="Option 4" class="w-full border p-2 rounded mb-2">
        <input id="qAnswer" type="text" placeholder="Exact Correct Answer" class="w-full border p-2 rounded mb-2">
        <button onclick="addQuestion()" class="w-full bg-green-600 text-white p-2 rounded">Add Question</button>
      </div>

      <!-- Add Notes/PDF -->
      <div class="bg-gray-50 p-4 rounded-lg border">
        <h3 class="font-semibold mb-2 text-purple-600">📄 Upload PDF Notes Link</h3>
        <input id="pdfTitle" type="text" placeholder="PDF Title" class="w-full border p-2 rounded mb-2">
        <input id="pdfUrl" type="text" placeholder="File URL / Path" class="w-full border p-2 rounded mb-2">
        <button onclick="addPDF()" class="w-full bg-purple-600 text-white p-2 rounded">Save PDF Info</button>
        <ul id="notesList" class="mt-3 list-disc pl-5"></ul>
      </div>
    </div>
  </div>

</body>
</html>
