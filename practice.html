<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brothko Institute - Practice</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBbhUJkMbLwsu8kgVC5zSmePpOr5EX6kyI",
      authDomain: "brothkointituteweb.firebaseapp.com",
      projectId: "brothkointituteweb",
      storageBucket: "brothkointituteweb.firebasestorage.app",
      messagingSenderId: "893115179713",
      appId: "1:893115179713:web:32bbe9218f434e211eea40"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // Check Authentication state & Email Verification
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await user.reload();
        if (!user.emailVerified) {
          document.getElementById("errorMsg").innerText = "⚠️ Please verify your email via the link sent to your inbox before logging in.";
          await signOut(auth);
          return;
        }

        currentUser = user;
        const docSnap = await getDoc(doc(db, "students", user.uid));
        if (docSnap.exists()) {
          // If profile is already registered/completed, load quiz box directly
          initQuizAppAfterLogin();
        }
      }
    });

    // Firebase Login Function
    window.firebaseLogin = async function(email, password) {
      return await signInWithEmailAndPassword(auth, email, password);
    };

    // Firebase Student Registration Function
    window.firebaseRegister = async function() {
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const name = document.getElementById("regName").value.trim();
      const fatherName = document.getElementById("regFatherName").value.trim();
      const enrollmentNo = document.getElementById("regEnrollment").value.trim();
      const college = document.getElementById("regCollege").value.trim();
      const course = document.getElementById("regCourse").value.trim();
      const branch = document.getElementById("regBranch").value.trim();
      const regError = document.getElementById("regError");
      regError.innerText = "";

      if (!email || !password || !name || !fatherName || !enrollmentNo || !college || !course || !branch) {
        regError.innerText = "⚠️ Please fill all registration fields!";
        return;
      }

      if (password.length < 6) {
        regError.innerText = "⚠️ Password must be at least 6 characters long";
        return;
      }

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        
        // Save full student details to Firestore database
        await setDoc(doc(db, "students", userCred.user.uid), {
          name,
          fatherName,
          enrollmentNo,
          email,
          college,
          course,
          branch,
          createdAt: new Date()
        });

        // Send Email Verification
        await sendEmailVerification(userCred.user);
        alert("✨ Registration Successful! A verification link has been sent to " + email + ". Please check your inbox, verify your email, and then log in.");
        
        // Sign out temporarily until email is verified and switch back to login view
        await signOut(auth);
        toggleRegisterView();
      } catch (err) {
        console.error("Registration Error:", err);
        regError.innerText = "❌ " + err.message;
      }
    };

    // Fetch questions from Firestore admin database
    window.fetchAdminQuestions = async function() {
      try {
        const querySnapshot = await getDocs(collection(db, "questions"));
        let loadedQuestions = { java: [], python: [], htmlcss: [], javascript: [] };
        
        querySnapshot.forEach((docSnap) => {
          let qData = docSnap.data();
          if (loadedQuestions[qData.subject]) {
            loadedQuestions[qData.subject].push(qData);
          }
        });
        return loadedQuestions;
      } catch (err) {
        console.error("Error fetching questions:", err);
        return {};
      }
    };
  </script>
</head>

<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-6">

  <!-- Login Box -->
  <div id="loginBox" class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md transform transition-all duration-300">

    <h2 class="text-3xl font-extrabold text-center text-indigo-600 mb-6">
      Login to Practice
    </h2>

    <input
      id="email"
      type="email"
      placeholder="📧 Email"
      class="w-full border rounded-xl p-3 mb-4 focus:ring-2 focus:ring-indigo-400 outline-none"
    >

    <input
      id="password"
      type="password"
      placeholder="🔑 Password"
      class="w-full border rounded-xl p-3 mb-4 focus:ring-2 focus:ring-indigo-400 outline-none"
    >

    <button
      onclick="login()"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold shadow-md transition-all"
    >
      🚀 Login
    </button>

    <button
      onclick="toggleRegisterView()"
      class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl mt-3 font-semibold shadow-md transition-all"
    >
      ✨ New Student? Register Here
    </button>

    <button
      onclick="backto()"
      class="w-full bg-gray-700 hover:bg-gray-800 text-white py-3 rounded-xl mt-3 font-semibold shadow-md transition-all"
    >
      🏠 Back To Home
    </button>

    <p id="errorMsg" class="text-red-600 mt-4 text-center font-semibold text-sm"></p>

  </div>

  <!-- Register Box (Hidden by default) -->
  <div id="registerBox" class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md hidden">

    <h2 class="text-3xl font-extrabold text-center text-purple-600 mb-6">
      Student Registration
    </h2>

    <input id="regName" type="text" placeholder="👤 Full Name" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regFatherName" type="text" placeholder="👨‍👦 Father's Name" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regEnrollment" type="text" placeholder="🔢 Enrollment Number" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regEmail" type="email" placeholder="📧 Email" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regPassword" type="password" placeholder="🔑 Password (min 6 characters)" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regCollege" type="text" placeholder="🏫 College Name" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regCourse" type="text" placeholder="📚 Course (e.g. BCA / B.Tech)" class="w-full border rounded-xl p-3 mb-3 outline-none">
    <input id="regBranch" type="text" placeholder="💻 Branch (e.g. CSE / IT)" class="w-full border rounded-xl p-3 mb-4 outline-none">

    <button
      onclick="firebaseRegister()"
      class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold shadow-md transition-all"
    >
      ✨ Register & Verify Email
    </button>

    <button
      onclick="toggleRegisterView()"
      class="w-full bg-gray-700 hover:bg-gray-800 text-white py-3 rounded-xl mt-3 font-semibold shadow-md transition-all"
    >
      🔙 Back To Login
    </button>

    <p id="regError" class="text-red-600 mt-4 text-center font-semibold text-sm"></p>

  </div>


  <!-- Quiz Section -->
  <div
    id="quizBox"
    class="hidden bg-white shadow-2xl rounded-2xl p-8 w-full max-w-4xl animate__animated animate__fadeIn"
  >

    <h2 class="text-3xl font-extrabold text-center text-green-600 mb-6">
      MCQ Practice
    </h2>


    <!-- Navigation Buttons -->
    <div class="flex justify-center flex-wrap gap-4 mb-6">

      <button
        onclick="loadQuestions('java')"
        class="px-6 py-2 bg-indigo-600 text-white rounded-xl shadow-md hover:scale-105 transform transition"
      >
        ☕ Java
      </button>

      <button
        onclick="loadQuestions('python')"
        class="px-6 py-2 bg-green-600 text-white rounded-xl shadow-md hover:scale-105 transform transition"
      >
        🐍 Python
      </button>

      <button
        onclick="loadQuestions('htmlcss')"
        class="px-6 py-2 bg-pink-600 text-white rounded-xl shadow-md hover:scale-105 transform transition"
      >
        🌐 HTML & CSS
      </button>

      <button
        onclick="loadQuestions('javascript')"
        class="px-6 py-2 bg-yellow-500 text-white rounded-xl shadow-md hover:scale-105 transform transition"
      >
        ⚡ JavaScript
      </button>

      <button
        onclick="quixeload()"
        class="px-6 py-2 bg-yellow-500 text-white rounded-xl shadow-md hover:scale-105 transform transition"
      >
        Quiz
      </button>

    </div>


    <!-- Questions -->
    <div id="questions" class="space-y-6"></div>


    <button
      onclick="logout()"
      class="mt-6 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl shadow-md font-semibold transition"
    >
      🚪 Logout
    </button>

  </div>


  <script>

    let allQuestions = {};
    let currentQuestions = [];


    // ==========================================
    // Render Questions
    // ==========================================

    function renderQuestions(questions) {

      const container = document.getElementById("questions");

      container.innerHTML = "";

      if (!questions || questions.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-4">No questions added by admin for this subject yet.</p>`;
        return;
      }

      questions.forEach((q, index) => {

        const div = document.createElement("div");

        div.classList.add(
          "p-5",
          "border",
          "rounded-xl",
          "shadow-md",
          "hover:shadow-lg",
          "transition-all",
          "bg-gray-50"
        );

        div.innerHTML = `
          <p class="font-bold mb-3 text-lg text-gray-800">
            ${index + 1}. ${q.q}
          </p>

          ${q.options.map(opt => `
            <button
              onclick="checkAnswer(${index}, '${opt}', this)"
              class="option-btn block w-full text-left border rounded-xl p-3 mb-2 hover:bg-indigo-100 transition-all"
            >
              ${opt}
            </button>
          `).join("")}
        `;

        container.appendChild(div);

      });

    }


    // ==========================================
    // Check Answer
    // ==========================================

    function checkAnswer(index, selected, btn) {

      const correct = currentQuestions[index].answer;
      const parent = btn.parentElement;
      parent.querySelectorAll(".option-btn").forEach(b => b.classList.remove("bg-green-500", "bg-red-500", "text-white"));

      if (selected === correct) {

        btn.classList.add(
          "bg-green-500",
          "text-white"
        );

      } else {

        btn.classList.add(
          "bg-red-500",
          "text-white"
        );

      }

    }

    window.checkAnswer = checkAnswer;


    // ==========================================
    // Load Questions by Language
    // ==========================================

    function loadQuestions(lang) {

      if (allQuestions[lang]) {

        currentQuestions = allQuestions[lang];

        renderQuestions(currentQuestions);

      }

    }

    window.loadQuestions = loadQuestions;


    // ==========================================
    // LOGIN USING FIREBASE
    // ==========================================

    async function login() {

      const email = document
        .getElementById("email")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value
        .trim();


      // Empty field validation
      if (!email || !password) {

        document.getElementById("errorMsg").innerText =
          "⚠️ Please enter Email and Password";

        return;
      }


      try {

        // Firebase Authentication
        await window.firebaseLogin(email, password);

        initQuizAppAfterLogin();

      } catch (err) {

        console.error("Firebase Login Error:", err);

        document.getElementById("errorMsg").innerText =
          "❌ Invalid Email or Password";

      }

    }

    window.login = login;


    // ==========================================
    // INITIALIZE AFTER SUCCESSFUL LOGIN
    // ==========================================

    async function initQuizAppAfterLogin() {
      // Hide Login Box
      document
        .getElementById("loginBox")
        .classList
        .add("hidden");

      document
        .getElementById("registerBox")
        .classList
        .add("hidden");


      // Show Quiz Box
      document
        .getElementById("quizBox")
        .classList
        .remove("hidden");


      // Load Questions from Admin Database (Firestore)
      allQuestions = await window.fetchAdminQuestions();


      // Default load Java
      loadQuestions("java");
    }


    // ==========================================
    // TOGGLE BETWEEN LOGIN & REGISTER VIEWS
    // ==========================================

    function toggleRegisterView() {
      document.getElementById("loginBox").classList.toggle("hidden");
      document.getElementById("registerBox").classList.toggle("hidden");
      document.getElementById("errorMsg").innerText = "";
      document.getElementById("regError").innerText = "";
    }
    window.toggleRegisterView = toggleRegisterView;


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {

      document
        .getElementById("quizBox")
        .classList
        .add("hidden");


      document
        .getElementById("loginBox")
        .classList
        .remove("hidden");


      document.getElementById("email").value = "";

      document.getElementById("password").value = "";

      document.getElementById("errorMsg").innerText = "";

    }

    window.logout = logout;


    // ==========================================
    // BACK TO HOME
    // ==========================================

    function backto() {

      document.location.href = "index.html";

    }


    // ==========================================
    // QUIZ PAGE
    // ==========================================

    function quixeload() {

      document.location.href = "quiz.html";

    }

  </script>

</body>
</html>
